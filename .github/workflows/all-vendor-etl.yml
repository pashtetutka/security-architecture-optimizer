name: SIEM ETL
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -c constraints.txt -e .
      - run: python -m compileall -q src tools app.py
      - run: python -m siem.etl crawl --dry-run
      - run: python tools/build_v2_bundle.py --help
      - run: python -m pip wheel --no-deps --wheel-dir results/wheel .
  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -c constraints.txt -e .
      - name: Collect and normalize current vendor materials
        run: |
          & pwsh -NoProfile -File tools/run_etl.ps1 -OutputDir results/live -ExcludeRestrictedDocuments
          $code = $LASTEXITCODE
          Write-Output "ETL exit: $code (0=complete, 3=complete with unavailable sources, 4=no data)"
          if ($code -eq 3) {
            Write-Output '::warning::Catalog built with unavailable sources'
            exit 0
          }
          exit $code
