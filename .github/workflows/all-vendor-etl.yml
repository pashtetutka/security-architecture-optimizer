name: SIEM vendor ETL (13 vendors)
on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 1'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Download official published materials
        run: python -m siem.etl crawl --output results/siem-etl.json --snapshot-dir results/raw
      - name: All-vendor status
        run: python -m siem.etl status --etl results/siem-etl.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siem-etl-snapshot
          path: |
            results/siem-etl.json
            results/raw/
          retention-days: 30
